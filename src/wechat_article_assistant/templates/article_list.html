{% extends "base.html" %}

{% block title %}文章列表 - 微信公众号文章阅读助手{% endblock %}

{% block content %}
<!-- 页面标题和批量操作 -->
<div class="flex justify-between items-center mb-4">
    <h2 class="text-2xl font-bold">文章列表</h2>
    <div class="flex items-center space-x-4">
                            <button onclick="downloadSelected()" class="px-4 py-2 bg-green-500 text-white rounded-md hover:bg-green-600">
            下载选中
        </button>
        <button onclick="deleteSelected()" class="px-4 py-2 bg-red-500 text-white rounded-md hover:bg-red-600">
            删除选中
        </button>
    </div>
</div>

<div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6">
    <!-- 搜索和筛选 -->
    <div class="mb-6 flex flex-wrap items-end gap-3">
        <div class="flex-grow min-w-[200px]">
            <label for="searchInput" class="sr-only">搜索文章标题或作者</label>
            <input type="text" id="searchInput" placeholder="搜索标题或作者（回车）" 
                   class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 h-[42px] dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white">
        </div>
        <div>
            <label for="filterNickname" class="sr-only">公众号</label>
            <select id="filterNickname" class="px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 h-[42px] dark:bg-gray-700 dark:border-gray-600 dark:text-white" title="按公众号筛选">
                <option value="">所有公众号</option>
            </select>
        </div>
        <div>
            <label for="filterDeleted" class="sr-only">是否删除</label>
            <select id="filterDeleted" class="px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 h-[42px] dark:bg-gray-700 dark:border-gray-600 dark:text-white" title="按删除状态筛选">
                <option value="">是否删除</option>
                <option value="否">否</option>
                <option value="是">是</option>
            </select>
        </div>
        <div>
            <label for="filterDownloaded" class="sr-only">是否下载</label>
            <select id="filterDownloaded" class="px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 h-[42px] dark:bg-gray-700 dark:border-gray-600 dark:text-white" title="按下载状态筛选">
                <option value="">是否下载</option>
                <option value="否">否</option>
                <option value="是">是</option>
            </select>
        </div>
        <div>
            <label for="filterStartDate" class="sr-only">开始日期</label>
            <input type="date" id="filterStartDate" class="px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 h-[42px] dark:bg-gray-700 dark:border-gray-600 dark:text-white dark:[color-scheme:dark]" title="开始日期">
        </div>
        <div>
            <label for="filterEndDate" class="sr-only">结束日期</label>
            <input type="date" id="filterEndDate" class="px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 h-[42px] dark:bg-gray-700 dark:border-gray-600 dark:text-white dark:[color-scheme:dark]" title="结束日期">
        </div>
        <div>
            <button onclick="applyFilters()" class="px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600 h-[42px]">
                查询
            </button>
        </div>
    </div>
    <!-- 文章列表表格 -->
    <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50 dark:bg-gray-700/50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase"><input type="checkbox" id="selectAll" class="w-4 h-4"></th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase">公众号</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase">标题</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase">作者</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase">发布时间</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase">已删除</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase">已下载</th>
                </tr>
            </thead>
            <tbody id="articleTableBody" class="bg-white divide-y divide-gray-200 dark:bg-gray-800 dark:divide-gray-700">
                <!-- 数据由JavaScript填充 -->
            </tbody>
        </table>
    </div>

    <!-- 分页 -->
    <div class="mt-6 flex justify-between items-center">
        <div class="text-sm text-gray-700">
            共 <span id="totalCount">0</span> 篇文章
        </div>
            <div id="pagination-container" class="flex items-center space-x-1">
                <!-- Pagination buttons will be dynamically inserted here by JavaScript -->
            </div>    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentPage = 1;
let pageSize = 20;
let totalArticles = 0;
let selectedIds = new Set();

// 加载文章列表
async function loadArticles() {
    try {
        const search = document.getElementById('searchInput').value;
        const nickname = document.getElementById('filterNickname').value;
        const isDeleted = document.getElementById('filterDeleted').value;
        const isDownloaded = document.getElementById('filterDownloaded').value;
        const startDate = document.getElementById('filterStartDate').value;
        const endDate = document.getElementById('filterEndDate').value;

        const params = new URLSearchParams({
            page: currentPage,
            pageSize: pageSize,
            ...(search && { search }),
            ...(nickname && { nickname }),
            ...(isDeleted && { isDeleted }),
            ...(isDownloaded && { isDownloaded }),
            ...(startDate && { startDate }),
            ...(endDate && { endDate })
        });

        const result = await apiRequest(`/api/article/list?${params}`);
        if (result.success) {
            totalArticles = result.total;
            renderArticles(result.data);
            updatePagination();
        }
    } catch (error) {
        showNotification('加载文章列表失败', 'error');
    }
}

// 渲染文章列表
function renderArticles(articles) {
    const tbody = document.getElementById('articleTableBody');
    tbody.innerHTML = '';

    if (articles.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="px-6 py-4 text-center text-gray-500">暂无数据</td></tr>';
        return;
    }

    articles.forEach(article => {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td class="px-6 py-4">
                <input type="checkbox" class="article-checkbox w-4 h-4" data-id="${article.id}" 
                       ${selectedIds.has(article.id) ? 'checked' : ''}>
            </td>
            <td class="px-6 py-4">${article.nickname || '-'}</td>
            <td class="px-6 py-4 max-w-md">
                <a href="${article.article_link}" target="_blank" class="text-blue-600 dark:text-blue-400 hover:text-blue-800 hover:underline">
                    ${article.article_title || '-'}
                </a>
            </td>
            <td class="px-6 py-4">${article.article_author_name || '-'}</td>
            <td class="px-6 py-4 whitespace-nowrap">${article.article_create_time || '-'}</td>
            <td class="px-6 py-4">
                <span class="px-2 py-1 text-xs rounded-full ${article.article_is_deleted === '是' ? 'bg-red-200 text-red-800 dark:bg-red-900/60 dark:text-red-300' : 'bg-green-200 text-green-800 dark:bg-green-900/60 dark:text-green-300'}">
                    ${article.article_is_deleted}
                </span>
            </td>
            <td class="px-6 py-4">
                <span class="px-2 py-1 text-xs rounded-full ${article.is_downloaded === '是' ? 'bg-blue-200 text-blue-800 dark:bg-blue-900/60 dark:text-blue-300' : 'bg-gray-200 text-gray-800 dark:bg-gray-600 dark:text-gray-100'}">
                    ${article.is_downloaded}
                </span>
            </td>
        `;
        tbody.appendChild(row);
    });

    // 添加复选框事件监听
    document.querySelectorAll('.article-checkbox').forEach(checkbox => {
        checkbox.addEventListener('change', updateSelectedCount);
    });
}

// 更新分页信息
function updatePagination() {
    const totalPages = Math.ceil(totalArticles / pageSize);
    document.getElementById('totalCount').textContent = totalArticles;

    const container = document.getElementById('pagination-container');
    container.innerHTML = '';

    if (totalPages <= 1) {
        return; // Don't render pagination if not needed
    }

    // Styles for buttons
    const baseStyle = 'inline-flex items-center justify-center px-4 py-2 text-sm font-medium border rounded-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500';
    const btnStyle = `${baseStyle} bg-white border-gray-300 text-gray-700 hover:bg-gray-50 dark:bg-gray-800 dark:border-gray-600 dark:text-gray-300 dark:hover:bg-gray-700`;
    const activeBtnStyle = `${baseStyle} bg-blue-500 border-blue-500 text-white hover:bg-blue-600 dark:bg-blue-600 dark:hover:bg-blue-700`;
    const disabledBtnStyle = `${baseStyle} bg-gray-50 border-gray-200 text-gray-400 cursor-not-allowed dark:bg-gray-700 dark:border-gray-600 dark:text-gray-500`;
    const ellipsisStyle = 'inline-flex items-center px-2 py-2 text-sm font-medium text-gray-500 select-none';

    const renderButton = (text, page, isDisabled = false, isActive = false) => {
        const el = document.createElement('button');
        el.textContent = text;
        if (page) {
            el.onclick = () => goToPage(page);
        }
        el.disabled = isDisabled;

        if (isActive) {
            el.className = activeBtnStyle;
        } else if (isDisabled) {
            el.className = disabledBtnStyle;
        } else {
            el.className = btnStyle;
        }
        return el;
    };
    
    const renderEllipsis = () => {
        const el = document.createElement('span');
        el.textContent = '...';
        el.className = ellipsisStyle;
        return el;
    };

    // Previous button
    container.appendChild(renderButton('上一页', currentPage - 1, currentPage === 1));

    // Page numbers
    const pagesToShow = [];
    if (totalPages <= 7) {
        for (let i = 1; i <= totalPages; i++) pagesToShow.push(i);
    } else {
        pagesToShow.push(1);
        if (currentPage > 3) {
            pagesToShow.push('...');
        }
        if (currentPage > 2) {
            pagesToShow.push(currentPage - 1);
        }
        if (currentPage !== 1 && currentPage !== totalPages) {
            pagesToShow.push(currentPage);
        }
        if (currentPage < totalPages - 1) {
            pagesToShow.push(currentPage + 1);
        }
        if (currentPage < totalPages - 2) {
            pagesToShow.push('...');
        }
        pagesToShow.push(totalPages);
    }
    
    [...new Set(pagesToShow)].forEach(page => {
        if (page === '...') {
            container.appendChild(renderEllipsis());
        } else {
            container.appendChild(renderButton(page, page, false, page === currentPage));
        }
    });

    // Next button
    container.appendChild(renderButton('下一页', currentPage + 1, currentPage === totalPages));
}

// 跳转到指定页
function goToPage(page) {
    const totalPages = Math.ceil(totalArticles / pageSize);
    if (page >= 1 && page <= totalPages && page !== currentPage) {
        currentPage = page;
        loadArticles();
    }
}

// 上一页
function previousPage() {
    goToPage(currentPage - 1);
}

// 下一页
function nextPage() {
    goToPage(currentPage + 1);
}

// 应用筛选
function applyFilters() {
    currentPage = 1;
    loadArticles();
}

// 全选/取消全选
document.getElementById('selectAll').addEventListener('change', (e) => {
    const checkboxes = document.querySelectorAll('.article-checkbox');
    checkboxes.forEach(checkbox => {
        checkbox.checked = e.target.checked;
        const id = parseInt(checkbox.dataset.id);
        if (e.target.checked) {
            selectedIds.add(id);
        } else {
            selectedIds.delete(id);
        }
    });
    updateSelectedCount();
});

// 更新选中数量
function updateSelectedCount() {
    selectedIds.clear();
    document.querySelectorAll('.article-checkbox:checked').forEach(checkbox => {
        selectedIds.add(parseInt(checkbox.dataset.id));
    });

    
    // 更新全选状态
    const allCheckboxes = document.querySelectorAll('.article-checkbox');
    const checkedCheckboxes = document.querySelectorAll('.article-checkbox:checked');
    document.getElementById('selectAll').checked = allCheckboxes.length > 0 && allCheckboxes.length === checkedCheckboxes.length;
}

// 下载选中文章
async function downloadSelected() {
    if (selectedIds.size === 0) {
        showNotification('请选择要下载的文章', 'error');
        return;
    }

    if (!confirm(`确定要下载选中的 ${selectedIds.size} 篇文章吗？`)) {
        return;
    }

    try {
        showNotification('开始下载，请稍候...', 'info');
        const result = await apiRequest('/api/article/download', {
            method: 'POST',
            body: JSON.stringify({ ids: Array.from(selectedIds) })
        });

        if (result.success) {
            showNotification(result.message, 'success');
            loadArticles();
            selectedIds.clear();
            updateSelectedCount();
        } else {
            showNotification(result.message || '下载失败', 'error');
        }
    } catch (error) {
        showNotification('下载失败', 'error');
    }
}

// 删除选中文章
async function deleteSelected() {
    if (selectedIds.size === 0) {
        showNotification('请选择要删除的文章', 'error');
        return;
    }

    if (!confirm(`确定要删除选中的 ${selectedIds.size} 篇文章吗？`)) {
        return;
    }

    try {
        const result = await apiRequest('/api/article/delete', {
            method: 'POST',
            body: JSON.stringify({ ids: Array.from(selectedIds) })
        });

        if (result.success) {
            showNotification(result.message, 'success');
            loadArticles();
            selectedIds.clear();
            updateSelectedCount();
        } else {
            showNotification(result.message || '删除失败', 'error');
        }
    } catch (error) {
        showNotification('删除失败', 'error');
    }
}

// 加载公众号名称列表（用于筛选）
async function loadAccountNames() {
    try {
        const result = await apiRequest('/api/article/names');
        if (result.success) {
            const select = document.getElementById('filterNickname');
            result.data.forEach(name => {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                select.appendChild(option);
            });
        }
    } catch (error) {
        console.error('加载公众号名称失败:', error);
    }
}

// 搜索框回车事件
document.getElementById('searchInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
        applyFilters();
    }
});

// 页面加载时初始化
window.addEventListener('DOMContentLoaded', () => {
    loadArticles();
    loadAccountNames();
});
</script>
{% endblock %}
