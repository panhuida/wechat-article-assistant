<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}微信公众号文章阅读助手{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <body class="bg-gray-100">
    <div class="flex h-screen">
        <!-- 侧边栏 -->
        <aside id="sidebar" class="bg-gray-800 text-white w-64 flex-shrink-0 flex flex-col transition-all duration-300 ease-in-out">
            <!-- 品牌/标题 -->
            <div class="h-16 flex items-center justify-center border-b border-gray-700 flex-shrink-0">
                <h1 class="text-xl font-bold text-center whitespace-nowrap overflow-hidden">
                    <span class="menu-text">阅读助手</span>
                </h1>
            </div>
    
            <!-- 导航菜单 -->
            <nav class="flex-grow p-4">
                <ul class="space-y-2">
                    <li>
                        <a href="/wechat" class="nav-link flex items-center px-4 py-2 rounded hover:bg-gray-700">
                            <svg class="h-6 w-6 flex-shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                            </svg>
                            <span class="ml-3 menu-text whitespace-nowrap">公众号管理</span>
                        </a>
                    </li>
                    <li>
                        <a href="/articles" class="nav-link flex items-center px-4 py-2 rounded hover:bg-gray-700">
                            <svg class="h-6 w-6 flex-shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                            </svg>
                            <span class="ml-3 menu-text whitespace-nowrap">公众号文章</span>
                        </a>
                    </li>
                </ul>
            </nav>
    
            <!-- 折叠按钮 -->
            <div class="p-4 border-t border-gray-700 flex-shrink-0">
                <button id="sidebar-toggle" class="w-full flex items-center justify-center p-2 rounded hover:bg-gray-700">
                    <svg id="toggle-icon" class="h-6 w-6 transition-transform duration-300" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
                    </svg>
                </button>
            </div>
        </aside>
    
        <!-- 主内容区 -->
        <main class="flex-1 overflow-auto">
            <div class="container mx-auto p-6">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <!-- 通知组件 -->
    <div id="notification" class="fixed top-4 right-4 hidden z-50">
        <div class="bg-white rounded-lg shadow-lg p-4 max-w-sm">
            <div class="flex items-center">
                <div id="notification-icon" class="flex-shrink-0 mr-3"></div>
                <p id="notification-message" class="text-sm text-gray-700"></p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const sidebar = document.getElementById('sidebar');
            const toggleButton = document.getElementById('sidebar-toggle');
            const toggleIcon = document.getElementById('toggle-icon');
            const menuTexts = document.querySelectorAll('.menu-text');
            const navLinks = document.querySelectorAll('.nav-link');

            // 从localStorage加载侧边栏状态
            const isCollapsed = localStorage.getItem('sidebarCollapsed') === 'true';
            if (isCollapsed) {
                collapseSidebar();
            }

            toggleButton.addEventListener('click', function () {
                if (sidebar.classList.contains('w-20')) {
                    expandSidebar();
                    localStorage.setItem('sidebarCollapsed', 'false');
                } else {
                    collapseSidebar();
                    localStorage.setItem('sidebarCollapsed', 'true');
                }
            });

            function collapseSidebar() {
                sidebar.classList.remove('w-64');
                sidebar.classList.add('w-20');
                toggleIcon.classList.add('rotate-180');
                menuTexts.forEach(text => text.classList.add('hidden'));
                navLinks.forEach(link => link.classList.add('justify-center'));
            }

            function expandSidebar() {
                sidebar.classList.remove('w-20');
                sidebar.classList.add('w-64');
                toggleIcon.classList.remove('rotate-180');
                menuTexts.forEach(text => text.classList.remove('hidden'));
                navLinks.forEach(link => link.classList.remove('justify-center'));
            }
        });

        // 通知函数
        function showNotification(message, type = 'info') {
            const notification = document.getElementById('notification');
            const icon = document.getElementById('notification-icon');
            const messageEl = document.getElementById('notification-message');

            messageEl.textContent = message;

            // 设置图标和颜色
            if (type === 'success') {
                icon.innerHTML = '<svg class="w-6 h-6 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';
            } else if (type === 'error') {
                icon.innerHTML = '<svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>';
            } else {
                icon.innerHTML = '<svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';
            }

            notification.classList.remove('hidden');

            setTimeout(() => {
                notification.classList.add('hidden');
            }, 3000);
        }

        // API请求辅助函数
        async function apiRequest(url, options = {}) {
            try {
                const response = await fetch(url, {
                    ...options,
                    headers: {
                        'Content-Type': 'application/json',
                        ...options.headers
                    }
                });
                return await response.json();
            } catch (error) {
                console.error('API请求失败:', error);
                throw error;
            }
        }
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
