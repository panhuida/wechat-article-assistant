<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}微信公众号文章阅读助手{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/png">
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f3f4f6; } /* gray-100 */
        .dark .custom-scrollbar::-webkit-scrollbar-track { background: #1f2937; } /* gray-800 */
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #9ca3af; border-radius: 4px; } /* gray-400 */
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6b7280; } /* gray-500 */

        #sidebar {
            transition: width 0.3s ease-in-out;
            width: 14rem; /* w-56 */
        }
        #sidebar.collapsed {
            width: 5rem; /* 80px */
        }
        #sidebar.collapsed .sidebar-text, #sidebar.collapsed .sidebar-brand-text {
            display: none;
        }
        #sidebar.collapsed .sidebar-link, #sidebar.collapsed .sidebar-footer {
            justify-content: center;
        }
        #sidebar.collapsed .sidebar-link img, #sidebar.collapsed .sidebar-footer svg, #sidebar.collapsed .sidebar-footer span {
            margin-right: 0;
        }
        #sidebar.collapsed #sidebar-toggle .toggle-arrow {
            transform: rotate(180deg);
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside id="sidebar" class="bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 flex flex-col">
            <div class="flex items-center justify-center p-6 text-2xl font-bold border-b border-gray-200 dark:border-gray-700 h-20">
                <a href="/" title="点击标题跳转到首页" class="flex items-center">
                    <img src="{{ url_for('static', filename='favicon.png') }}" alt="logo" class="w-8 h-8 mr-2">
                    <span class="sidebar-brand-text text-blue-600 dark:text-blue-400">阅读助手</span>
                </a>
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <a href="/wechat" class="sidebar-link flex items-center px-4 py-2 rounded-lg font-medium hover:bg-gray-100 dark:hover:bg-gray-700 {% if request.endpoint == 'wechat_list' %}bg-gray-100 dark:bg-gray-700 text-blue-600 dark:text-white{% else %}text-gray-600 dark:text-gray-300{% endif %}">
                    <img src="{{ url_for('static', filename='wechat.png') }}" alt="公众号管理" class="w-6 h-6 mr-3">
                    <span class="sidebar-text">公众号管理</span>
                </a>
                <a href="/articles" class="sidebar-link flex items-center px-4 py-2 rounded-lg font-medium hover:bg-gray-100 dark:hover:bg-gray-700 {% if request.endpoint == 'article_list' %}bg-gray-100 dark:bg-gray-700 text-blue-600 dark:text-white{% else %}text-gray-600 dark:text-gray-300{% endif %}">
                    <img src="{{ url_for('static', filename='article.png') }}" alt="公众号文章" class="w-6 h-6 mr-3">
                    <span class="sidebar-text">公众号文章</span>
                </a>
            </nav>
            <div class="p-4 border-t border-gray-200 dark:border-gray-700 space-y-2">
                <button id="theme-toggle" type="button" onclick="toggleTheme()" class="sidebar-footer flex items-center w-full py-2 px-4 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
                    <span id="theme-toggle-icon" class="w-6 h-6 mr-3"></span>
                    <span id="theme-toggle-text" class="sidebar-text text-sm"></span>
                </button>
                <button id="sidebar-toggle" type="button" class="sidebar-footer flex items-center w-full py-2 px-4 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
                    <svg class="w-6 h-6 mr-3 toggle-arrow transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"></path></svg>
                    <span class="sidebar-text text-sm">折叠侧栏</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col h-screen">
            <div class="flex-1 p-6 lg:p-8 overflow-y-auto custom-scrollbar">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <!-- Notification Component -->
    <div id="notification" class="fixed top-5 right-5 hidden z-50 animate-fade-in-down">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-4 max-w-sm border dark:border-gray-700">
            <div class="flex items-center">
                <div id="notification-icon" class="flex-shrink-0 mr-3"></div>
                <p id="notification-message" class="text-sm font-medium text-gray-700 dark:text-gray-200"></p>
            </div>
        </div>
    </div>

    <script>
        function updateThemeUI() {
            const isDark = document.documentElement.classList.contains('dark');
            const iconContainer = document.getElementById('theme-toggle-icon');
            const textContainer = document.getElementById('theme-toggle-text');
            if (!iconContainer || !textContainer) return;

            if (isDark) {
                iconContainer.innerHTML = '<svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>'; // Moon
                textContainer.textContent = '暗色模式';
            } else {
                iconContainer.innerHTML = '<svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7.464 9.464a1 1 0 01-1.414 0l-.707-.707a1 1 0 011.414-1.414l.707.707a1 1 0 010 1.414zM4.54 5.95a1 1 0 011.414 0l.707.707a1 1 0 01-1.414 1.414L4.54 7.364A1 1 0 014.54 5.95zM3 11a1 1 0 100-2H2a1 1 0 100 2h1z" clip-rule="evenodd"></path></svg>'; // Sun
                textContainer.textContent = '亮色模式';
            }
        }

        function toggleTheme() {
            const isDarkMode = document.documentElement.classList.contains('dark');
            
            if (isDarkMode) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('color-theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('color-theme', 'dark');
            }
            
            updateThemeUI();
        }

        function handleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const toggleButton = document.getElementById('sidebar-toggle');
            if (!sidebar || !toggleButton) return;

            if (localStorage.getItem('sidebar-collapsed') === 'true') {
                sidebar.classList.add('collapsed');
            }

            toggleButton.addEventListener('click', function () {
                sidebar.classList.toggle('collapsed');
                const isCollapsed = sidebar.classList.contains('collapsed');
                localStorage.setItem('sidebar-collapsed', isCollapsed);
            });
        }
        
        function showNotification(message, type = 'info') {
            const notification = document.getElementById('notification');
            const icon = document.getElementById('notification-icon');
            const messageEl = document.getElementById('notification-message');
            if(!notification || !icon || !messageEl) return;

            const icons = {
                success: '<svg class="w-6 h-6 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>',
                error: '<svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>',
                info: '<svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>'
            };
            icon.innerHTML = icons[type] || icons['info'];
            
            notification.classList.remove('hidden');
            setTimeout(() => { notification.classList.add('hidden'); }, 3000);
        }

        async function apiRequest(url, options = {}) {
            try {
                const response = await fetch(url, {
                    ...options,
                    headers: { 'Content-Type': 'application/json', ...options.headers }
                });
                return await response.json();
            } catch (error) {
                console.error('API请求失败:', error);
                throw error;
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            // Set initial theme based on saved preference or system setting
            const preferredTheme = localStorage.getItem('color-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            if (preferredTheme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            
            // Listen for system theme changes
            const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
            mediaQuery.addEventListener('change', (e) => {
                // Only update if user hasn't set a preference
                if (!localStorage.getItem('color-theme')) {
                    if (e.matches) {
                        document.documentElement.classList.add('dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                    }
                    updateThemeUI();
                }
            });
            
            handleSidebar();
            updateThemeUI();
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
