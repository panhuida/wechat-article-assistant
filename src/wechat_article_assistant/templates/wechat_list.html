{% extends "base.html" %}

{% block title %}公众号管理 - 微信公众号文章阅读助手{% endblock %}

{% block content %}
<div class="flex justify-between items-center mb-4">
    <h2 class="text-2xl font-bold">公众号管理</h2>
    <button onclick="openAddModal()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
        新增公众号
    </button>
</div>

<div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6">

    <!-- 公众号列表表格 -->
    <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50 dark:bg-gray-700/50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase">头像</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase">名称</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase">别名</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase">签名</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase">采集进度</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase">采集状态</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase">操作</th>
                </tr>
            </thead>
            <tbody id="accountTableBody" class="bg-white divide-y divide-gray-200 dark:bg-gray-800 dark:divide-gray-700">
                <!-- 数据由JavaScript填充 -->
            </tbody>
        </table>
    </div>
</div>

<!-- 新增/编辑公众号模态框 -->
<div id="accountModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden overflow-y-auto h-full w-full z-50">
    <div class="relative top-20 mx-auto p-5 border w-full max-w-2xl shadow-lg rounded-md bg-white dark:bg-gray-800">
        <div class="flex justify-between items-center mb-4 pb-4 border-b border-gray-200 dark:border-gray-700">
            <h3 id="modalTitle" class="text-xl font-bold">新增公众号</h3>
            <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 dark:text-gray-400 dark:hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>

        <!-- Tab切换 -->
        <div class="mb-4 border-b border-gray-200 dark:border-gray-700">
            <nav class="flex space-x-4">
                <button id="manualTab" onclick="switchTab('manual')" class="py-2 px-4 border-b-2 font-medium">
                    手工录入
                </button>
                <button id="autoTab" onclick="switchTab('auto')" class="py-2 px-4 border-b-2 font-medium">
                    自动获取
                </button>
            </nav>
        </div>

        <!-- 手工录入表单 -->
        <div id="manualForm">
            <form id="accountForm" class="space-y-4">
                <input type="hidden" id="accountId">
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">公众号名称 *</label>
                        <input type="text" id="nickname" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">别名</label>
                        <input type="text" id="alias" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">FakeID</label>
                    <input type="text" id="fakeid" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">头像URL</label>
                    <input type="text" id="round_head_img" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">签名</label>
                    <textarea id="signature" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">备注</label>
                    <textarea id="memo" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">起始位置</label>
                        <input type="number" id="begin" value="0" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">采集数量</label>
                        <input type="number" id="count" value="5" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white">
                    </div>
                </div>

                <div class="flex justify-end space-x-3 pt-4">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 dark:border-gray-600 dark:text-gray-300 dark:hover:bg-gray-700">
                        取消
                    </button>
                    <button type="submit" class="px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600">
                        保存
                    </button>
                </div>
            </form>
        </div>

        <!-- 自动获取表单 -->
        <div id="autoForm" class="hidden">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">搜索公众号</label>
                    <div class="flex space-x-2">
                        <input type="text" id="searchQuery" placeholder="输入公众号名称关键词" class="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white">
                        <button onclick="searchAccount()" class="px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600">
                            搜索
                        </button>
                    </div>
                </div>

                <div id="searchResults" class="hidden">
                    <h4 class="font-medium mb-2 dark:text-gray-200">搜索结果：</h4>
                    <div id="searchResultsList" class="space-y-2 max-h-96 overflow-y-auto">
                        <!-- 搜索结果由JavaScript填充 -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentAccountId = null;
let isEditMode = false;

// 加载公众号列表
async function loadAccounts() {
    try {
        const result = await apiRequest('/api/wechat/list');
        if (result.success) {
            renderAccounts(result.data);
        }
    } catch (error) {
        showNotification('加载公众号列表失败', 'error');
    }
}

// 转换图片URL为代理URL
function toProxyUrl(url) {
    if (!url) return url;
    // 将微信图片URL转换为代理URL
    return `/api/image-proxy?url=${encodeURIComponent(url)}`;
}

// 渲染公众号列表
function renderAccounts(accounts) {
    const tbody = document.getElementById('accountTableBody');
    tbody.innerHTML = '';

    if (accounts.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="px-6 py-4 text-center text-gray-500">暂无数据</td></tr>';
        return;
    }

    accounts.forEach(account => {
        const row = document.createElement('tr');
        const avatarUrl = toProxyUrl(account.round_head_img);
        row.innerHTML = `
            <td class="px-6 py-4 whitespace-nowrap">
                ${account.round_head_img ? `<img src="${avatarUrl}" class="w-10 h-10 rounded-full" onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
                <div class="w-10 h-10 bg-gray-300 dark:bg-gray-600 rounded-full" style="display:none;"></div>` : '<div class="w-10 h-10 bg-gray-300 dark:bg-gray-600 rounded-full"></div>'}
            </td>
            <td class="px-6 py-4">${account.nickname || '-'}</td>
            <td class="px-6 py-4">${account.alias || '-'}</td>
            <td class="px-6 py-4 max-w-xs break-words whitespace-normal">${account.signature || '-'}</td>
            <td class="px-6 py-4">${account.begin || 0}</td>
            <td class="px-6 py-4">
                <span class="px-2 py-1 text-xs rounded-full ${getStatusClass(account.collect_status)}">
                    ${account.collect_status}
                </span>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm space-x-2">
                <button onclick="editAccount(${account.id})" class="text-blue-600 hover:text-blue-800 dark:text-blue-400 dark:hover:text-blue-300">编辑</button>
                <button onclick="deleteAccount(${account.id})" class="text-red-600 hover:text-red-800 dark:text-red-400 dark:hover:text-red-300">删除</button>
                <button onclick="collectSingle(${account.id})" class="text-green-600 hover:text-green-800 dark:text-green-400 dark:hover:text-green-300">单页采集</button>
                <button onclick="collectAll(${account.id})" class="text-purple-600 hover:text-purple-800 dark:text-purple-400 dark:hover:text-purple-300">全部采集</button>
            </td>
        `;
        tbody.appendChild(row);
    });
}

// 获取状态样式类
function getStatusClass(status) {
    const statusMap = {
        '未采集': 'bg-gray-200 text-gray-800 dark:bg-gray-600 dark:text-gray-100',
        '采集中': 'bg-blue-200 text-blue-800 dark:bg-blue-900/60 dark:text-blue-300',
        '已采集': 'bg-green-200 text-green-800 dark:bg-green-900/60 dark:text-green-300',
        '失败': 'bg-red-200 text-red-800 dark:bg-red-900/60 dark:text-red-300'
    };
    return statusMap[status] || 'bg-gray-200 text-gray-800 dark:bg-gray-600 dark:text-gray-100';
}

// 打开新增模态框
function openAddModal() {
    isEditMode = false;
    currentAccountId = null;
    document.getElementById('modalTitle').textContent = '新增公众号';
    document.getElementById('accountForm').reset();
    document.getElementById('accountModal').classList.remove('hidden');
    switchTab('manual');
}

// 编辑公众号
async function editAccount(id) {
    isEditMode = true;
    currentAccountId = id;
    
    try {
        const result = await apiRequest(`/api/wechat/${id}`);
        if (result.success) {
            const account = result.data;
            document.getElementById('modalTitle').textContent = '编辑公众号';
            document.getElementById('accountId').value = account.id;
            document.getElementById('nickname').value = account.nickname || '';
            document.getElementById('alias').value = account.alias || '';
            document.getElementById('fakeid').value = account.fakeid || '';
            document.getElementById('round_head_img').value = account.round_head_img || '';
            document.getElementById('signature').value = account.signature || '';
            document.getElementById('memo').value = account.memo || '';
            document.getElementById('begin').value = account.begin || 0;
            document.getElementById('count').value = account.count || 5;
            
            document.getElementById('accountModal').classList.remove('hidden');
            switchTab('manual');
        }
    } catch (error) {
        showNotification('加载公众号信息失败', 'error');
    }
}

// 删除公众号
async function deleteAccount(id) {
    if (!confirm('确定要删除该公众号吗？')) {
        return;
    }

    try {
        const result = await apiRequest(`/api/wechat/${id}`, { method: 'DELETE' });
        if (result.success) {
            showNotification('删除成功', 'success');
            loadAccounts();
        } else {
            showNotification(result.message || '删除失败', 'error');
        }
    } catch (error) {
        showNotification('删除失败', 'error');
    }
}

// 关闭模态框
function closeModal() {
    document.getElementById('accountModal').classList.add('hidden');
}

// 切换Tab
function switchTab(tab) {
    const manualTab = document.getElementById('manualTab');
    const autoTab = document.getElementById('autoTab');
    const manualForm = document.getElementById('manualForm');
    const autoForm = document.getElementById('autoForm');

    // Define classes for active and inactive states for both light and dark modes
    const activeClasses = ['border-blue-500', 'text-blue-600', 'dark:border-blue-400', 'dark:text-blue-400'];
    const inactiveClasses = ['border-transparent', 'text-gray-500', 'hover:text-gray-700', 'dark:text-gray-400', 'dark:hover:text-gray-300'];

    if (tab === 'manual') {
        manualTab.classList.add(...activeClasses);
        manualTab.classList.remove(...inactiveClasses);
        autoTab.classList.add(...inactiveClasses);
        autoTab.classList.remove(...activeClasses);
        manualForm.classList.remove('hidden');
        autoForm.classList.add('hidden');
    } else { // auto tab
        autoTab.classList.add(...activeClasses);
        autoTab.classList.remove(...inactiveClasses);
        manualTab.classList.add(...inactiveClasses);
        manualTab.classList.remove(...activeClasses);
        autoForm.classList.remove('hidden');
        manualForm.classList.add('hidden');
    }
}

// 搜索公众号
async function searchAccount() {
    const query = document.getElementById('searchQuery').value.trim();
    if (!query) {
        showNotification('请输入搜索关键词', 'error');
        return;
    }

    try {
        // 显示加载提示
        showNotification('正在搜索，如需登录会自动打开浏览器...', 'info');
        
        const result = await apiRequest('/api/wechat/search', {
            method: 'POST',
            body: JSON.stringify({ query })
        });

        if (result.success) {
            renderSearchResults(result.data);
        } else {
            showNotification(result.message || '搜索失败', 'error');
        }
    } catch (error) {
        showNotification('搜索失败', 'error');
    }
}

// 渲染搜索结果
function renderSearchResults(accounts) {
    const container = document.getElementById('searchResultsList');
    container.innerHTML = '';

    if (accounts.length === 0) {
        container.innerHTML = '<p class="text-gray-500 text-center">未找到相关公众号</p>';
        document.getElementById('searchResults').classList.remove('hidden');
        return;
    }

    accounts.forEach(account => {
        const div = document.createElement('div');
        div.className = 'border border-gray-200 dark:border-gray-700 rounded-lg p-4 hover:bg-gray-50 dark:hover:bg-gray-700/50 cursor-pointer';
        div.onclick = () => selectSearchResult(account);
        const avatarUrl = toProxyUrl(account.round_head_img);
        div.innerHTML = `
            <div class="flex items-center">
                ${account.round_head_img ? `<img src="${avatarUrl}" class="w-12 h-12 rounded-full mr-3" onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
                <div class="w-12 h-12 bg-gray-300 dark:bg-gray-600 rounded-full mr-3" style="display:none;"></div>` : '<div class="w-12 h-12 bg-gray-300 dark:bg-gray-600 rounded-full mr-3"></div>'}
                <div class="flex-1">
                    <h5 class="font-medium">${account.nickname}</h5>
                    <p class="text-sm text-gray-500 dark:text-gray-400">${account.signature || '暂无签名'}</p>
                </div>
            </div>
        `;
        container.appendChild(div);
    });

    document.getElementById('searchResults').classList.remove('hidden');
}

// 选择搜索结果
function selectSearchResult(account) {
    switchTab('manual');
    document.getElementById('nickname').value = account.nickname || '';
    document.getElementById('alias').value = account.alias || '';
    document.getElementById('fakeid').value = account.fakeid || '';
    document.getElementById('round_head_img').value = account.round_head_img || '';
    document.getElementById('signature').value = account.signature || '';
}

// 表单提交
document.getElementById('accountForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const data = {
        nickname: document.getElementById('nickname').value,
        alias: document.getElementById('alias').value,
        fakeid: document.getElementById('fakeid').value,
        round_head_img: document.getElementById('round_head_img').value,
        signature: document.getElementById('signature').value,
        memo: document.getElementById('memo').value,
        begin: parseInt(document.getElementById('begin').value) || 0,
        count: parseInt(document.getElementById('count').value) || 5
    };

    try {
        let result;
        if (isEditMode && currentAccountId) {
            result = await apiRequest(`/api/wechat/${currentAccountId}`, {
                method: 'PUT',
                body: JSON.stringify(data)
            });
        } else {
            result = await apiRequest('/api/wechat/create', {
                method: 'POST',
                body: JSON.stringify(data)
            });
        }

        if (result.success) {
            showNotification(result.message || '保存成功', 'success');
            closeModal();
            loadAccounts();
        } else {
            showNotification(result.message || '保存失败', 'error');
        }
    } catch (error) {
        showNotification('保存失败', 'error');
    }
});

// 单页采集
async function collectSingle(id) {
    try {
        showNotification('开始采集...', 'info');
        const result = await apiRequest(`/api/article/collect/single/${id}`, { method: 'POST' });
        
        if (result.success) {
            showNotification(result.message, 'success');
            loadAccounts();
        } else {
            showNotification(result.message || '采集失败', 'error');
        }
    } catch (error) {
        showNotification('采集失败', 'error');
    }
}

// 全部采集
async function collectAll(id) {
    if (!confirm('全部采集可能需要较长时间，确定继续吗？')) {
        return;
    }

    try {
        showNotification('开始采集，请稍候...', 'info');
        const result = await apiRequest(`/api/article/collect/all/${id}`, { method: 'POST' });
        
        if (result.success) {
            showNotification(result.message, 'success');
            loadAccounts();
        } else {
            showNotification(result.message || '采集失败', 'error');
        }
    } catch (error) {
        showNotification('采集失败', 'error');
    }
}

// 页面加载时获取公众号列表
window.addEventListener('DOMContentLoaded', () => {
    loadAccounts();
});
</script>
{% endblock %}
