[project]
name = "wechat-article-assistant"
version = "0.1.0"
description = "微信公众号文章阅读助手"
readme = "README.md"
authors = [
    { name = "panhuida" }
]
requires-python = ">=3.12"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
keywords = [
    "wechat",
    "wechat-public-account",
    "flask",
    "playwright",
    "wechat-article-downloader",
]
urls = { Homepage = "https://github.com/panhuida/wechat-article-assistant", Repository = "https://github.com/panhuida/wechat-article-assistant", "Bug Tracker" = "https://github.com/panhuida/wechat-article-assistant/issues" }
dependencies = [
    "flask>=3.0.0,<4.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "python-dotenv>=1.0.0",
    "playwright>=1.40.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pillow>=10.0.0",
    "qrcode>=7.4.0",
    "psycopg2-binary>=2.9.0",
    "lxml>=6.0.2",
]

[project.scripts]
wechat-article-assistant = "wechat_article_assistant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wechat_article_assistant"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/wechat_article_assistant",
    "/run.py",
    "/wechat-cli.py",
    "/README.md",
    "/LICENSE",
]

[dependency-groups]
dev = [
    "ruff>=0.1.0",
    "ty>=0.0.34",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio",
    "pytest-mock",
    "types-requests>=2.31.0",
    "types-beautifulsoup4",
    "types-Pillow",
    "pre-commit",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "Q",   # flake8-quotes
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
]
ignore = ["E501"]  # line too long (handled by formatter)

[tool.ruff.lint.isort]
known-first-party = ["wechat_article_assistant"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = "tests/e2e/manual"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "--cov=wechat_article_assistant",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=60",
    "--tb=short",
    "--strict-markers",
    "-v",
]
markers = [
    "unit: marks fast isolated unit tests",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "contract: marks fixture-driven contract tests",
    "e2e: marks end-to-end tests",
    "manual: marks manual or environment-dependent tests",
]

[tool.ty.environment]
python-version = "3.12"
python-platform = "all"

[tool.ty.rules]
invalid-assignment = "warn"
invalid-argument-type = "warn"

[tool.ty.src]
include = ["src"]
